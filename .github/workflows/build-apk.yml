name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Rename APK to School Name
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk Pragathi-Vidyalaya-School.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pragathi-Vidyalaya-School-APK
        path: Pragathi-Vidyalaya-School.apk

    - name: Publish Direct Download to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: latest
        name: "Pragathi Vidyalaya School Mobile APK"
        body: "Latest Android APK for Pragathi Vidyalaya School Daily Child Observation Portal."
        files: Pragathi-Vidyalaya-School.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
