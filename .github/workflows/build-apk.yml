name: Build Android APK

on:
  push:
    branches: [ main, master, turso-firebase ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build
      env:
        VITE_TURSO_DATABASE_URL: https://pragathi-preschool-vijaya.aws-ap-south-1.turso.io
        VITE_TURSO_AUTH_TOKEN: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3OTA4Njg2NDYsImlkIjoiMDFhMGY4MGYtMjUwMS03YTgwLWE0NzYtNzNmM2JiNzRkMjY3Iiwia2lkIjoiSXdkdmN2SUlFdlhocHlSWm91RmV2OUJZcDFmQnBBWVozb3MtM1U5anRDdyIsInJpZCI6IjhlYjRjZDRiLTJiOTAtNGU0Yy1iNGZlLWQyMTYwYmMwMGYzMSJ9.n4IHm_DuSKPwbcU3klkwCLCldXgEST9Y3OIkZ6BuDTvbaYU_42Z4WSuZ4mSe2nbqfH5MpDo7S8a0mk0A-3BaDQ
        VITE_FIREBASE_API_KEY: AIzaSyBFtsqhCq4Cy4ZnAFFUSkJ9X8RWttxUv64
        VITE_FIREBASE_AUTH_DOMAIN: pragati-preschool.firebaseapp.com
        VITE_FIREBASE_PROJECT_ID: pragati-preschool
        VITE_FIREBASE_STORAGE_BUCKET: pragati-preschool.firebasestorage.app
        VITE_FIREBASE_MESSAGING_SENDER_ID: "862077392244"
        VITE_FIREBASE_APP_ID: 1:862077392244:web:ff5aa313e7ef0533df4821

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Rename APK to School Name
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk Pragathi-Vidyalaya-School.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pragathi-Vidyalaya-School-APK
        path: Pragathi-Vidyalaya-School.apk

    - name: Publish Direct Download to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/turso-firebase'
      with:
        tag_name: latest
        name: "Pragathi Vidyalaya School Mobile APK"
        body: "Latest Android APK for Pragathi Vidyalaya School Daily Child Observation Portal."
        files: Pragathi-Vidyalaya-School.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
